<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Twegle — Quizzes, Quotes & Chaos for Everyone</title>
    <!-- Sets the dark/light class before React (or even the CSS) loads, so
         a dark-mode visitor never sees a flash of the light theme on first
         paint. Reads a saved choice first; falls back to the OS/browser
         preference for a first-time visitor who's never toggled it. -->
    <script>
      (function () {
        var saved = localStorage.getItem('twegle-theme')
        var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', isDark)
      })()
    </script>
    <!-- Google Analytics (GA4) — public site only. Skipped on /admin routes
         so admin/editor usage of the CMS itself doesn't pollute visitor
         analytics with non-visitor traffic. -->
    <script>
      if (!location.pathname.startsWith('/admin')) {
        var gaScript = document.createElement('script')
        gaScript.async = true
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-KYTM35VQCT'
        document.head.appendChild(gaScript)
        window.dataLayer = window.dataLayer || []
        function gtag() { dataLayer.push(arguments) }
        gtag('js', new Date())
        gtag('config', 'G-KYTM35VQCT')
      }
    </script>
    <!-- Google AdSense — site-verification/ad-serving script. Google's own
         instructions require this literally present in every page's <head>
         (not conditionally injected via JS), which is also why it's not
         gated to public-only like the GA4 script above — Googlebot only
         ever crawls public URLs anyway (/admin is disallowed in robots.txt). -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2005648459702569"
     crossorigin="anonymous"></script>
    <meta name="description" content="Twegle — quizzes, puzzles, jokes, quotes, games, stories, horoscope & chaos. No sign up, just share-worthy content for everyone." />
    <!-- Generic fallback preview for the homepage/general links. Individual
         quiz results and posts get their own accurate preview via the
         /api/share/* redirect pages (see backend/src/controllers/shareController.js)
         since this static HTML can't change per-page in a client-rendered app. -->
    <meta property="og:title" content="Twegle — Quizzes, Quotes & Chaos for Everyone" />
    <meta property="og:description" content="Quizzes, puzzles, jokes, quotes, games, stories, horoscope & chaos. No sign up, just pick something and go." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
